name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with dev deps)
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: End-to-end smoke — run the agent-loop demo and score it
        run: |
          bash examples/agent-loop-demo/run.sh
          # the simulated agent drives the full loop, so the scorecard must be >=5/6
          python3 examples/claude-code-task/score.py examples/agent-loop-demo/workdir
