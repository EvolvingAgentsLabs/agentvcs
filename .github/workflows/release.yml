name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # required for PyPI trusted publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/agentvcs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No password: this publishes via OIDC trusted publishing. Configure a
        # publisher at https://pypi.org/manage/account/publishing/ whose claims
        # match exactly: Owner=EvolvingAgentsLabs, Repo=agentvcs,
        # Workflow=release.yml, Environment=pypi. See docs/RELEASING.md.
