<!DOCTYPE html>
<!--
  agentvcs dashboard — the local "Dashboard del Tiempo".
  One self-contained file: no framework, no build step, no dependencies.
  Talks to the read-only JSON API served by agentvcs.ui.server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentvcs — evolution</title>
<style>
  :root {
    --bg:#0d1117; --panel:#11161d; --panel2:#161c24; --border:#222b36;
    --fg:#d7dde5; --dim:#7d8794; --b:#e6edf3;
    --fluid:#39c5cf; --crystal:#3fb950; --yellow:#d9a441;
    --add:#3fb950; --del:#f85149; --mod:#d9a441;
    --think:#a371f7; --tool:#39c5cf; --result:#3fb950;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:var(--mono);
         font-size:13px; line-height:1.5; display:flex; flex-direction:column; height:100vh; }
  a { color:var(--fluid); }

  header.top { display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-bottom:1px solid var(--border); background:var(--panel); flex:0 0 auto; }
  header.top .logo { font-weight:700; color:var(--b); letter-spacing:.5px; }
  header.top .logo b { color:var(--fluid); }
  header.top .goal { color:var(--dim); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; flex:1; }
  header.top select { background:var(--panel2); color:var(--fg); border:1px solid var(--border);
    border-radius:6px; padding:4px 8px; font-family:var(--mono); font-size:12px; }
  .live { font-size:11px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .live .dot { width:8px; height:8px; border-radius:50%; background:var(--crystal);
    box-shadow:0 0 6px var(--crystal); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  main { flex:1; display:flex; min-height:0; }
  .left { width:340px; flex:0 0 340px; border-right:1px solid var(--border);
    overflow-y:auto; background:var(--panel); }
  .right { flex:1; overflow-y:auto; min-width:0; }

  .commit { display:grid; grid-template-columns:18px 1fr; gap:8px; padding:10px 14px;
    border-bottom:1px solid var(--border); cursor:pointer; }
  .commit:hover { background:var(--panel2); }
  .commit.sel { background:#1b2530; box-shadow:inset 3px 0 0 var(--fluid); }
  .rail { display:flex; flex-direction:column; align-items:center; }
  .rail .node { width:11px; height:11px; border-radius:50%; margin-top:4px; flex:0 0 auto; }
  .rail .line { width:2px; flex:1; background:var(--border); margin-top:2px; }
  .node.fluid { background:var(--fluid); box-shadow:0 0 6px var(--fluid); }
  .node.crystallized { background:var(--crystal); box-shadow:0 0 6px var(--crystal); }
  .commit .msg { color:var(--b); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .commit .meta { color:var(--dim); font-size:11px; display:flex; gap:8px; }
  .commit .id { color:var(--yellow); }
  .badge { font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid; }
  .badge.fluid { color:var(--fluid); border-color:var(--fluid); }
  .badge.crystallized { color:var(--crystal); border-color:var(--crystal); }

  .detail { padding:18px 22px; max-width:980px; }
  .detail h2 { margin:0 0 2px; font-size:15px; color:var(--b); display:flex; align-items:center; gap:10px; }
  .detail .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .detail .goal { background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--yellow);
    border-radius:6px; padding:10px 12px; margin-bottom:16px; color:var(--fg); }
  .detail .goal .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }

  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab { padding:7px 14px; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; }
  .tab.active { color:var(--b); border-bottom-color:var(--fluid); }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
  .card .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  .card pre { margin:0; white-space:pre-wrap; word-break:break-word; color:var(--fg); }

  .diffbox .dim { margin-bottom:10px; }
  .diffbox .dim .label { color:var(--b); font-weight:600; margin-bottom:3px; }
  .diffbox .add { color:var(--add); } .diffbox .del { color:var(--del); } .diffbox .mod { color:var(--mod); }
  .diffbox .fromto { color:var(--dim); }
  .diffbox .none { color:var(--dim); font-style:italic; }

  /* conversation */
  .turn { margin-bottom:14px; }
  .turn .who { font-size:11px; color:var(--dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
  .turn .who .model { color:var(--think); text-transform:none; }
  .bubble { background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
  .turn.user .bubble { background:#13202b; border-color:#1d3242; }
  .blk { border-radius:6px; padding:8px 10px; margin-top:8px; font-size:12px; }
  .blk:first-child { margin-top:0; }
  .blk.thinking { background:#191427; border:1px solid #2a2140; color:#c0aef0; font-style:italic; }
  .blk.tool_use { background:#0f2026; border:1px solid #1c3b44; }
  .blk.tool_result { background:#0f2118; border:1px solid #1d3a29; }
  .blk .tag { font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; display:block; }
  .blk.thinking .tag { color:var(--think); } .blk.tool_use .tag { color:var(--tool); }
  .blk.tool_result .tag { color:var(--result); }
  .blk pre { margin:0; white-space:pre-wrap; word-break:break-word; }
  details.tool_result summary { cursor:pointer; color:var(--result); list-style:none; }
  details summary::-webkit-details-marker { display:none; }

  .empty { color:var(--dim); padding:40px 22px; font-style:italic; }
  .placeholder { color:var(--dim); padding:60px 22px; text-align:center; }
</style>
</head>
<body>
<header class="top">
  <span class="logo">agent<b>vcs</b></span>
  <select id="branchSel" title="branch"></select>
  <span class="goal" id="repoGoal"></span>
  <span class="live"><span class="dot"></span><span id="liveLabel">live</span></span>
</header>
<main>
  <div class="left" id="commits"></div>
  <div class="right" id="detail">
    <div class="placeholder">Select a commit to see how the agent's mind moved.</div>
  </div>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const short = o => o ? o.slice(0,9) : "-";

let state = { commits:[], selected:null, tab:"overview", head:null };

async function api(path){
  const r = await fetch("/api" + path);
  const j = await r.json();
  if(!j.ok) throw new Error((j.error && j.error.code) || "error");
  return j;
}

// ---------------------------------------------------------------- left pane
function renderCommits(){
  const el = $("#commits");
  if(!state.commits.length){ el.innerHTML = '<div class="empty">No commits yet.</div>'; return; }
  el.innerHTML = state.commits.map((c, i) => {
    const last = i === state.commits.length - 1;
    const sel = c.commit === state.selected ? " sel" : "";
    return `<div class="commit${sel}" data-oid="${c.commit}">
      <div class="rail"><span class="node ${c.state}"></span>${last?"":'<span class="line"></span>'}</div>
      <div>
        <div class="msg">${esc(c.message)}</div>
        <div class="meta"><span class="id">${short(c.commit)}</span>
          <span class="badge ${c.state}">${c.state}</span>
          <span>${esc(c.timestamp)}</span></div>
      </div></div>`;
  }).join("");
  el.querySelectorAll(".commit").forEach(node =>
    node.onclick = () => select(node.dataset.oid));
}

// ---------------------------------------------------------------- right pane
async function select(oid){
  state.selected = oid;
  renderCommits();
  const { commit } = await api("/commit/" + oid);
  let diff = null;
  try { diff = (await api("/diff?b=" + oid)).diff; } catch(e){ /* root commit */ }
  renderDetail(commit, diff);
}

function renderDetail(c, diff){
  const model = c.models[0] ? `${c.models[0].provider}/${c.models[0].model}` : "—";
  $("#detail").innerHTML = `
    <div class="detail">
      <h2>${short(c.commit)} <span class="badge ${c.state}">${c.state}</span>
        <span style="color:var(--dim);font-weight:400;font-size:12px">${esc(model)}</span></h2>
      <div class="sub">${esc(c.message)} · ${esc(c.timestamp)} · ${esc(c.author)}</div>
      <div class="goal"><span class="k">goal</span><br>${esc(c.goal) || '<i>—</i>'}</div>
      <div class="tabs">
        <div class="tab" data-tab="overview">Overview</div>
        <div class="tab" data-tab="conversation">Conversation (${c.trace_messages})</div>
      </div>
      <div id="tabBody"></div>
    </div>`;
  state._commit = c; state._diff = diff;
  $("#detail").querySelectorAll(".tab").forEach(t =>
    t.onclick = () => { state.tab = t.dataset.tab; paintTab(); });
  paintTab();
}

function paintTab(){
  const c = state._commit;
  $("#detail").querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === state.tab));
  $("#tabBody").innerHTML = state.tab === "conversation"
    ? '<div class="empty">loading…</div>' : overviewHTML(c, state._diff);
  if(state.tab === "conversation") loadConversation(c.commit);
}

function overviewHTML(c, diff){
  const models = c.models.map(m => `<div class="card"><div class="k">model</div>
    <pre>${esc(m.provider)}/${esc(m.model)}${m.version?("@"+esc(m.version)):""}
params=${esc(JSON.stringify(m.params||{}))}</pre></div>`).join("") ||
    '<div class="card"><div class="k">models</div><pre>—</pre></div>';
  const metrics = `<div class="card"><div class="k">metrics</div>
    <pre>${esc(JSON.stringify(c.metrics||{}, null, 2))}</pre></div>`;
  const crystal = c.crystal ? `<div class="card"><div class="k">crystal</div>
    <pre>${short(c.crystal)}\n(deterministic recipe)</pre></div>` : "";
  return `<div class="grid">${models}${metrics}${crystal}</div>
    <div class="card diffbox"><div class="k">change vs parent</div>${diffHTML(diff)}</div>`;
}

function diffHTML(d){
  if(!d) return '<div class="none">root commit — nothing before it</div>';
  const out = [];
  const code = d.code || {added:[],removed:[],modified:[]};
  if(code.added.length || code.removed.length || code.modified.length){
    out.push('<div class="dim"><div class="label">code</div>' +
      code.added.map(p=>`<div class="add">+ ${esc(p)}</div>`).join("") +
      code.removed.map(p=>`<div class="del">− ${esc(p)}</div>`).join("") +
      code.modified.map(p=>`<div class="mod">~ ${esc(p)}</div>`).join("") + '</div>');
  }
  if(d.goal) out.push(`<div class="dim"><div class="label">goal</div>
    <div class="fromto">from: ${esc(d.goal.from)}<br>to:&nbsp;&nbsp;${esc(d.goal.to)}</div></div>`);
  if(d.models) out.push(`<div class="dim"><div class="label">models</div>
    <div class="fromto">from: ${esc(JSON.stringify(d.models.from))}<br>to:&nbsp;&nbsp;${esc(JSON.stringify(d.models.to))}</div></div>`);
  if(d.trace) out.push(`<div class="dim"><div class="label">trace</div>
    <div class="fromto">${d.trace.from} → ${d.trace.to} (${d.trace.delta>=0?"+":""}${d.trace.delta} messages)</div></div>`);
  if(d.state) out.push(`<div class="dim"><div class="label">state</div>
    <div class="fromto">${esc(d.state.from)} → ${esc(d.state.to)}</div></div>`);
  return out.length ? out.join("") : '<div class="none">no changes</div>';
}

// ----------------------------------------------------- conversation (the trace)
async function loadConversation(oid){
  let msgs = [];
  try { msgs = (await api("/commit/" + oid + "/trace")).trace || []; } catch(e){}
  if(state.selected !== oid) return; // user clicked away while loading
  $("#tabBody").innerHTML = msgs.length
    ? msgs.map(turnHTML).join("")
    : '<div class="empty">No trace captured for this commit.</div>';
}

function turnHTML(m){
  const role = m.role || "?";
  const model = m.model ? ` <span class="model">(${esc(m.model)})</span>` : "";
  return `<div class="turn ${role}"><div class="who">${esc(role)}${model}</div>
    <div class="bubble">${contentHTML(m.content)}</div></div>`;
}

// Mirror of cli._render_content: text / thinking / tool_use / tool_result blocks.
function contentHTML(content){
  if(typeof content === "string") return esc(content) || "<i>(empty)</i>";
  if(!Array.isArray(content)) return esc(JSON.stringify(content));
  return content.map(b => {
    if(typeof b !== "object" || b === null) return esc(String(b));
    switch(b.type){
      case "text": return esc(b.text || "");
      case "thinking": return blk("thinking", "thinking", esc((b.thinking || b.text || "").trim()));
      case "tool_use": return blk("tool_use", "tool_use · " + esc(b.name || "?"),
        "<pre>" + esc(JSON.stringify(b.input || {}, null, 2)) + "</pre>");
      case "tool_result": {
        const text = resultText(b.content);
        return `<details class="blk tool_result"><summary class="tag">tool_result ▸</summary>
          <pre>${esc(text)}</pre></details>`;
      }
      default: return blk(b.type || "block", b.type || "block", "");
    }
  }).join("");
}
function blk(cls, tag, inner){ return `<div class="blk ${cls}"><span class="tag">${tag}</span>${inner}</div>`; }
function resultText(inner){
  if(typeof inner === "string") return inner;
  if(Array.isArray(inner)) return inner.map(x => (x && x.text) || "").join("\n");
  return JSON.stringify(inner);
}

// ---------------------------------------------------------------- bootstrap + live
async function refresh(){
  const log = await api("/log");
  const newHead = log.commits[0] ? log.commits[0].commit : null;
  if(newHead !== state.head || log.commits.length !== state.commits.length){
    state.commits = log.commits;
    state.head = newHead;
    renderCommits();
    if(!state.selected && state.commits[0]) select(state.commits[0].commit);
  }
}

async function boot(){
  try {
    const repo = await api("/repo");
    $("#repoGoal").textContent = repo.goal || "";
    const sel = $("#branchSel");
    sel.innerHTML = repo.branches.map(b =>
      `<option ${b.name===repo.current?"selected":""}>${esc(b.name)}</option>`).join("")
      || '<option>main</option>';
    await refresh();
  } catch(e){
    $("#detail").innerHTML = '<div class="placeholder">Could not reach the repository.<br>' + esc(e.message) + '</div>';
  }
  setInterval(() => refresh().catch(()=>{}), 2000); // live: grow as the agent commits
}
boot();
</script>
</body>
</html>
